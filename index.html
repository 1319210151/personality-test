<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBTI 性格测试 — 发现你的人格类型</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
  display: flex; justify-content: center; align-items: flex-start; padding: 20px;
}
.container {
  width: 100%; max-width: 720px; background: #fff; border-radius: 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.25); overflow: hidden; margin: 20px 0;
}

.page { display: none; }
.page.active { display: block; animation: fadeIn 0.35s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

.welcome-wrap { padding: 48px 40px; text-align: center; }
.welcome-icon { font-size: 72px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
.welcome-title { font-size: 30px; font-weight: 800; color: #1a202c; margin-bottom: 4px; }
.welcome-brand { font-size: 14px; color: #9f7aea; font-weight: 700; letter-spacing: 2px; margin-bottom: 14px; }
.welcome-desc { font-size: 14px; color: #718096; line-height: 1.7; margin-bottom: 28px; }

.info-row { display: flex; gap: 12px; margin-bottom: 32px; }
.info-item { flex:1; background:#f7f5ff; border-radius:14px; padding:18px 12px; text-align:center; transition:transform 0.2s; }
.info-item:hover { transform:translateY(-2px); }
.info-item .ico { font-size:30px; margin-bottom:6px; }
.info-item .lbl { font-size:13px; color:#553c9a; font-weight:700; }
.info-item .val { font-size:11px; color:#a0aec0; margin-top:3px; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 32px; border:none; border-radius:14px;
  font-size:16px; font-weight:700; cursor:pointer;
  transition:all 0.2s; user-select:none; -webkit-tap-highlight-color:transparent;
}
.btn:active { transform:scale(0.97); }
.btn-primary { width:100%; background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; font-size:17px; padding:16px; }
.btn-primary:hover { box-shadow:0 10px 30px rgba(102,126,234,0.45); transform:translateY(-2px); }
.btn-outline { width:100%; background:#fff; color:#667eea; border:2px solid #667eea; margin-top:10px; }
.btn-outline:hover { background:#f7f5ff; }
.btn-save { width:100%; background:#48bb78; color:#fff; margin-top:10px; }
.btn-save:hover { background:#38a169; box-shadow:0 8px 25px rgba(72,187,120,0.4); }

.quiz-wrap { padding: 32px 40px 36px; }
.progress-zone { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
.progress-track { flex:1; height:10px; background:#edf2f7; border-radius:5px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#667eea,#764ba2); border-radius:5px; transition:width 0.35s; }
.progress-label { font-size:13px; color:#718096; font-weight:600; white-space:nowrap; }

.q-badge { display:inline-block; background:#f0edff; color:#6b46c1; font-size:12px; font-weight:700; padding:5px 14px; border-radius:20px; margin-bottom:14px; }
.q-text { font-size:19px; font-weight:700; color:#1a202c; line-height:1.6; margin-bottom:22px; }

.opts { display:flex; flex-direction:column; gap:8px; }
.opt {
  display:flex; align-items:center; padding:15px 18px;
  border:2px solid #e2e8f0; border-radius:14px;
  cursor:pointer; transition:all 0.18s; -webkit-tap-highlight-color:transparent;
}
.opt:hover { border-color:#b794f4; background:#faf8ff; }
.opt.chosen { border-color:#7c3aed; background:#f5f0ff; }
.opt .dot {
  width:24px; height:24px; border-radius:50%;
  border:2.5px solid #cbd5e0; margin-right:14px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:all 0.18s;
}
.opt.chosen .dot { border-color:#7c3aed; background:#7c3aed; }
.opt.chosen .dot::after { content:"\2713"; color:#fff; font-size:13px; font-weight:700; }
.opt .txt { font-size:15px; color:#4a5568; }

.nav-row { display:flex; gap:12px; margin-top:26px; }
.nav-row .btn { flex:1; }
.btn-back { background:#edf2f7; color:#4a5568; }
.btn-back:hover { background:#e2e8f0; box-shadow:0 6px 18px rgba(0,0,0,0.06); }

.kbd-hint { text-align:center; margin-top:12px; font-size:11px; color:#cbd5e0; }
.kbd { display:inline-block; background:#edf2f7; color:#718096; padding:2px 7px; border-radius:4px; font-weight:600; margin:0 2px; }

.result-wrap { padding: 36px 40px 40px; }
.type-header { text-align:center; margin-bottom:22px; }
.type-code { font-size:54px; font-weight:900; letter-spacing:6px; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.type-name { font-size:26px; font-weight:800; color:#1a202c; margin:4px 0; }
.type-sub { font-size:14px; color:#718096; }

.section { background:#fafafa; border-radius:16px; padding:22px 24px; margin-bottom:14px; border:1px solid #f0f0f0; }
.section h3 { font-size:15px; color:#2d3748; margin-bottom:12px; }

.dim-row { margin-bottom:14px; }
.dim-row:last-child { margin-bottom:0; }
.dim-head { display:flex; justify-content:space-between; margin-bottom:4px; font-size:13px; }
.dim-left  { color:#e53e3e; font-weight:700; }
.dim-right { color:#3182ce; font-weight:700; }
.dim-track { height:10px; background:#edf2f7; border-radius:5px; overflow:hidden; position:relative; }
.dim-fill { height:100%; border-radius:5px; transition:width 1s ease; }
.dim-mid { position:absolute; top:-2px; bottom:-2px; left:50%; width:2px; background:#cbd5e0; transform:translateX(-50%); }

.desc-text { font-size:14px; color:#4a5568; line-height:1.85; white-space:pre-line; }
.tag-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.tag { background:#f0edff; color:#6b46c1; font-size:12px; font-weight:700; padding:6px 16px; border-radius:20px; }
.split { display:flex; gap:14px; }
.split .section { flex:1; }

#capture-area { position:absolute; left:-9999px; top:0; width:600px; background:#fff; padding:40px; font-family:sans-serif; }

@media (max-width:520px) {
  .welcome-wrap, .quiz-wrap, .result-wrap { padding:24px 18px; }
  .welcome-title { font-size:24px; }
  .q-text { font-size:17px; }
  .type-code { font-size:42px; letter-spacing:4px; }
  .split { flex-direction:column; }
  .info-row { flex-direction:column; }
}
</style>
</head>
<body>

<div class="container" id="app-container">

  <div class="page active" id="pg-welcome">
    <div class="welcome-wrap">
      <div class="welcome-icon">&#129518;</div>
      <div class="welcome-title">MBTI 性格测试</div>
      <div class="welcome-brand">MYERS-BRIGGS TYPE INDICATOR</div>
      <div class="welcome-desc">25 道精心设计的生活情景题，覆盖 6 大性格维度。<br>请凭第一反应作答——你犹豫的那几秒，往往就是答案。</div>
      <div class="info-row">
        <div class="info-item"><div class="ico">&#128221;</div><div class="lbl">25 题</div><div class="val">约 3 分钟</div></div>
        <div class="info-item"><div class="ico">&#129707;</div><div class="lbl">6 大维度</div><div class="val">全面剖析</div></div>
        <div class="info-item"><div class="ico">&#128101;</div><div class="lbl">16 种类型</div><div class="val">精准匹配</div></div>
        <div class="info-item"><div class="ico">&#128248;</div><div class="lbl">结果可保存</div><div class="val">一键导出图片</div></div>
      </div>
      <button class="btn btn-primary" id="btn-start">&#128640; 开始测试</button>
      <div style="margin-top:12px;font-size:12px;color:#a0aec0;">支持键盘：数字键 <b>1-5</b> 选择，<b>&larr; &rarr;</b> 翻题，<b>Enter</b> 下一题</div>
    </div>
  </div>

  <div class="page" id="pg-quiz">
    <div class="quiz-wrap">
      <div class="progress-zone">
        <div class="progress-track"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
        <div class="progress-label" id="prog-label">0 / 25</div>
      </div>
      <div class="q-badge" id="q-badge">第 1 题</div>
      <div class="q-text" id="q-text"></div>
      <div class="opts" id="opts"></div>
      <div class="nav-row">
        <button class="btn btn-back" id="btn-prev">&larr; 上一题</button>
        <button class="btn btn-primary" id="btn-next" style="flex:2">下一题 &rarr;</button>
      </div>
      <div class="kbd-hint">&#128161; <span class="kbd">1</span>-<span class="kbd">5</span> 选选项 &nbsp; <span class="kbd">&larr;</span> <span class="kbd">&rarr;</span> 翻题 &nbsp; <span class="kbd">Enter</span> 确认</div>
    </div>
  </div>

  <div class="page" id="pg-result">
    <div class="result-wrap" id="result-content">
      <div class="type-header">
        <div class="type-code" id="res-code"></div>
        <div class="type-name" id="res-name"></div>
        <div class="type-sub" id="res-sub"></div>
      </div>
      <div class="section" id="res-dims"></div>
      <div class="section">
        <h3>&#128214; 性格解读</h3>
        <div class="desc-text" id="res-desc"></div>
        <div class="tag-list" id="res-tags"></div>
      </div>
      <div class="split">
        <div class="section"><h3>&#128170; 核心优势</h3><div class="desc-text" id="res-str"></div></div>
        <div class="section"><h3>&#127793; 成长盲区</h3><div class="desc-text" id="res-grow"></div></div>
      </div>
      <div class="section">
        <h3>&#128188; 职业分析（个性化）</h3>
        <div class="desc-text" id="res-career"></div>
      </div>
      <button class="btn btn-save" id="btn-save">&#128248; 保存结果为图片</button>
      <button class="btn btn-outline" id="btn-retake">&#128260; 重新测试</button>
    </div>
  </div>

  <div id="capture-area"></div>
</div>

<script>
(function(){
'use strict';

var TOTAL = 25;
var curIdx = 0;
var answers = new Array(TOTAL).fill(-1);

var optionLabels = [
  '非常符合',
  '比较符合',
  '一般 / 中立',
  '不太符合',
  '严重不符合'
];

// 25道题目 — 6维度：EI(4题) SN(4题) TF(4题) JP(4题) ES(4题) AM(5题)
var questions = [
  // ===== E/I 社交能量：外向 vs 内向 (4题) =====
  { text:'在聚会或社交场合中，你通常是主动走向别人攀谈的那个人，而不是等着别人来找你。', dim:'EI', pole:'E' },
  { text:'结束一场热闹的社交活动回到家，关上门的那一刻你会长舒一口气——终于可以一个人待着了。', dim:'EI', pole:'I' },
  { text:'遇到困扰时你倾向于找朋友聊聊，通过交流来理清自己的思路，而不是一个人闷着消化。', dim:'EI', pole:'E' },
  { text:'独自工作或学习时你的效率最高，周围人太多反而会让你分心和消耗能量。', dim:'EI', pole:'I' },

  // ===== S/N 信息处理：感觉 vs 直觉 (4题) =====
  { text:'学习一项新技能时，你更喜欢跟着详细的教程一步步操作，而不是先大致了解一下然后自己摸索。', dim:'SN', pole:'S' },
  { text:'你经常会沉浸在对未来的想象和各种可能性中，以至于走路时脑子里天马行空、忽略了周围的环境。', dim:'SN', pole:'N' },
  { text:'向别人描述一件事时，你习惯先说清楚具体的时间地点和事实，然后再谈你的感受和联想。', dim:'SN', pole:'S' },
  { text:'你常常在不同领域的事物之间发现关联和规律，别人觉得毫不相干的事情你能看出内在的联系。', dim:'SN', pole:'N' },

  // ===== T/F 决策风格：思考 vs 情感 (4题) =====
  { text:'做重要决策时你优先考虑效率和客观标准，不太会让个人情感和人际关系影响你的最终判断。', dim:'TF', pole:'T' },
  { text:'朋友向你倾诉烦恼时，你的第一反应是给予情感安慰和共情，而不是直接帮他分析问题出在哪。', dim:'TF', pole:'F' },
  { text:'小组讨论中你发现方案有明显漏洞，你会直接指出来并举出理由，哪怕气氛可能会因此冷下来。', dim:'TF', pole:'T' },
  { text:'在团队中你经常扮演调和矛盾的角色，即使自己受点委屈也不想看到大家闹得太僵。', dim:'TF', pole:'F' },

  // ===== J/P 生活节奏：判断 vs 感知 (4题) =====
  { text:'出门旅行前几天你就开始收拾行李了，而且大概率会列一张清单，生怕漏带什么东西。', dim:'JP', pole:'J' },
  { text:'比起严格按计划表行事，你更享受随性而为的灵活感——计划赶不上变化，边走边调整才有趣。', dim:'JP', pole:'P' },
  { text:'有一件事悬着没结果（比如等面试通知、等重要回复），你这几天都会心神不宁，干什么都很难专心。', dim:'JP', pole:'J' },
  { text:'你大部分的工作或学习任务，都是在 deadline 临近时反而爆发出最高效率的。', dim:'JP', pole:'P' },

  // ===== ES 情绪稳定性：沉着 vs 敏感 (4题) =====
  { text:'遇到突发状况（比如航班突然取消、电脑死机文件没保存），你的第一反应是赶紧想办法解决，而不是先烦躁或崩溃。', dim:'ES', pole:'S' },
  { text:'别人当面给你提了一个比较直接的批评，你不会在心里翻来覆去地琢磨好几天——听听就过去了。', dim:'ES', pole:'S' },
  { text:'发了一条消息对方很久没有回复，你会控制不住地脑补「是不是我说错了什么」「他是不是对我有意见」。', dim:'ES', pole:'A' },
  { text:'睡前躺在床上，你的脑子经常自动开始循环播放今天说错的话、做错的事，越想越睡不着。', dim:'ES', pole:'A' },

  // ===== AM 成就动机：目标驱动 vs 随遇而安 (5题) =====
  { text:'你对自己未来三到五年有比较清晰的规划和方向，不是那种「走一步看一步、到时候再说」的人。', dim:'AM', pole:'H' },
  { text:'完成了一个目标之后你不会满足太久，很快就开始琢磨下一个挑战和成长方向是什么。', dim:'AM', pole:'H' },
  { text:'看到身边同龄人取得了比你更好的成绩，你不会只是羡慕，而是会想「我怎么做才能追上甚至超越」。', dim:'AM', pole:'H' },
  { text:'你对现在的生活状态总体满意，不太想为了更高的职位或更多的钱把自己搞得特别累。', dim:'AM', pole:'L' },
  { text:'「够用就好」比「做到极致」更贴近你的人生态度——没必要凡事都去争第一名。', dim:'AM', pole:'L' }
];

// ==================== 页面切换 ====================
function showPg(id) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) { pages[i].classList.remove('active'); }
  var t = document.getElementById('pg-' + id);
  if (t) { t.classList.add('active'); }
}

// ==================== 开始测试 ====================
function startTest() {
  curIdx = 0;
  answers = new Array(TOTAL).fill(-1);
  renderQ();
  updateProg();
  showPg('quiz');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ==================== 渲染题目 ====================
function renderQ() {
  var q = questions[curIdx];
  document.getElementById('q-badge').textContent = '第 ' + (curIdx + 1) + ' 题 / 共 ' + TOTAL + ' 题';
  document.getElementById('q-text').textContent = q.text;

  var h = '';
  for (var i = 0; i < optionLabels.length; i++) {
    var cls = answers[curIdx] === (i + 1) ? ' chosen' : '';
    h += '<div class="opt' + cls + '" data-v="' + (i + 1) + '">';
    h += '<div class="dot"></div><div class="txt">' + optionLabels[i] + '</div></div>';
  }
  document.getElementById('opts').innerHTML = h;

  // 绑定选项点击事件
  var opts = document.querySelectorAll('#opts .opt');
  for (var j = 0; j < opts.length; j++) {
    (function(val) {
      opts[j].addEventListener('click', function() { pick(val); });
    })(j + 1);
  }

  var prevBtn = document.getElementById('btn-prev');
  var nextBtn = document.getElementById('btn-next');
  prevBtn.style.visibility = curIdx === 0 ? 'hidden' : 'visible';
  nextBtn.textContent = curIdx === TOTAL - 1 ? '✨ 查看结果' : '下一题 →';
}

// ==================== 选择答案 ====================
function pick(val) {
  answers[curIdx] = val;
  var opts = document.querySelectorAll('#opts .opt');
  for (var i = 0; i < opts.length; i++) {
    var dv = parseInt(opts[i].getAttribute('data-v'));
    if (dv === val) { opts[i].classList.add('chosen'); }
    else { opts[i].classList.remove('chosen'); }
  }
}

// ==================== 进度条 ====================
function updateProg() {
  var done = 0;
  for (var i = 0; i < answers.length; i++) { if (answers[i] !== -1) { done++; } }
  var pct = Math.round((done / TOTAL) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-label').textContent = done + ' / ' + TOTAL;
}

// ==================== 导航 ====================
function prevQ() {
  if (curIdx > 0) { curIdx--; renderQ(); updateProg(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}

function nextQ() {
  if (answers[curIdx] === -1) {
    var optsEl = document.getElementById('opts');
    optsEl.style.animation = 'none';
    optsEl.offsetHeight;
    optsEl.style.animation = 'shake 0.4s ease';
    return;
  }
  if (curIdx < TOTAL - 1) {
    curIdx++;
    renderQ();
    updateProg();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    updateProg();
    showResult();
  }
}

// 注入抖动动画
var shakeStyle = document.createElement('style');
shakeStyle.textContent = '@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}';
document.head.appendChild(shakeStyle);

// ==================== 键盘 ====================
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('pg-quiz').classList.contains('active')) { return; }
  var k = e.key;
  if (k >= '1' && k <= '5') { pick(parseInt(k)); }
  else if (k === 'ArrowRight' || k === 'Enter') { e.preventDefault(); nextQ(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); prevQ(); }
});

// ==================== 绑定按钮事件 ====================
document.getElementById('btn-start').addEventListener('click', startTest);
document.getElementById('btn-prev').addEventListener('click', prevQ);
document.getElementById('btn-next').addEventListener('click', nextQ);
document.getElementById('btn-save').addEventListener('click', saveImage);
document.getElementById('btn-retake').addEventListener('click', retakeTest);

// ============================================================
//  评分（EI/SN/TF/JP/ES 各4题满分20中点12，AM 5题满分25中点15）
// ============================================================
function calcScores() {
  var raw = { EI:0, SN:0, TF:0, JP:0, ES:0, AM:0 };
  for (var i = 0; i < TOTAL; i++) {
    var q = questions[i];
    var val = answers[i];
    if (q.pole === 'I' || q.pole === 'N' || q.pole === 'F' || q.pole === 'P' || q.pole === 'A' || q.pole === 'L') {
      val = 6 - val;
    }
    raw[q.dim] += val;
  }
  // 4题维度中点12，5题维度(AM)中点15
  var type = '';
  type += raw.EI > 12 ? 'E' : 'I';
  type += raw.SN > 12 ? 'S' : 'N';
  type += raw.TF > 12 ? 'T' : 'F';
  type += raw.JP > 12 ? 'J' : 'P';
  type += raw.ES > 12 ? '-A' : '-T';  // Assertive稳定 / Turbulent敏感

  var toPct4 = function(score) { return Math.round(((score - 4) / 16) * 100); };
  var toPct5 = function(score) { return Math.round(((score - 5) / 20) * 100); };
  return {
    type: type,
    raw: raw,
    pctEI: toPct4(raw.EI), pctSN: toPct4(raw.SN), pctTF: toPct4(raw.TF),
    pctJP: toPct4(raw.JP), pctES: toPct4(raw.ES), pctAM: toPct5(raw.AM),
    assertive: raw.ES > 12
  };
}

// ============================================================
//  16 型人格解读（多维度深度描述）
// ============================================================

// ============================================================
//  动态职业建议生成器 — 根据每个人的6维得分定制
// ============================================================
function generateCareerAdvice(sc) {
  var lines = [];

  // E/I → 工作环境偏好
  if (sc.pctEI >= 65) {
    lines.push('你在人际互动中汲取能量，适合需要频繁沟通协作的角色——独处过多的工作反而会让你逐渐失去热情。');
  } else if (sc.pctEI <= 35) {
    lines.push('深度独处是你的充电方式，适合需要长时间专注和独立思考的岗位——开放式办公室和过多的会议对你来说是一种消耗。');
  } else {
    lines.push('你既能享受团队协作也能独立完成任务，在需要兼顾沟通和专注的岗位上往往能游刃有余。');
  }

  // S/N → 工作内容偏好
  if (sc.pctSN >= 65) {
    lines.push('你偏好务实、可落地的任务，对那些看得见摸得着的成果最有成就感。适合偏执行和实操类的工作，而非纯理论和概念探索。');
  } else if (sc.pctSN <= 35) {
    lines.push('你对抽象模式、未来趋势和深层含义有着天然的兴趣。重复性的、纯执行类的工作会很快耗尽你的热情，你需要一个能不断探索「可能性」的舞台。');
  } else {
    lines.push('你既能把控细节也能放眼全局，在需要「既见树木又见森林」的岗位上能发挥出独特的优势。');
  }

  // T/F → 决策与协作风格
  if (sc.pctTF >= 65) {
    lines.push('你倾向于用逻辑和数据驱动决策，适合需要客观分析和技术判断力的工作——在依赖规则和标准的领域里你如鱼得水。');
  } else if (sc.pctTF <= 35) {
    lines.push('你天生在意人的感受和关系的和谐，适合需要共情力、沟通温度和「人情味」的工作——没有人文关怀的冰冷环境会让你身心俱疲。');
  } else {
    lines.push('你在理性分析和感性共情之间找到了良好的平衡，在既需要专业判断又需要理解人的岗位上能够从容应对。');
  }

  // J/P → 工作节奏
  if (sc.pctJP >= 65) {
    lines.push('条理、秩序和明确的 deadline 是你高效运转的燃料。自由度过高、边界模糊的工作环境反而会让你焦虑。');
  } else if (sc.pctJP <= 35) {
    lines.push('你最好的状态往往来自灵活和自主——过于刻板的打卡制度、严格的流程管控会让你感到窒息。你需要一份给你足够弹性的工作。');
  } else {
    lines.push('你能适应有框架但不僵化的工作节奏——在有明确目标的前提下保有一定的灵活性，是你的最佳状态。');
  }

  // 情绪稳定性 → 压力环境
  if (sc.pctES >= 65) {
    lines.push('你的情绪韧性很强，能够在高压、突发状况频发的环境中保持冷静——危急时刻你往往是身边人最可靠的锚点。');
  } else if (sc.pctES <= 35) {
    lines.push('你对环境中的紧张和压力感知很敏锐。相比在高压行业硬撑，一个氛围友好、节奏可控的工作环境更能释放你的潜力——你不是「扛不住」，你需要一个不把你耗干的舞台。');
  }

  // 成就动机 → 成长路径
  if (sc.pctAM >= 65) {
    lines.push('你的内驱力很强，需要一份有上升空间、能不断挑战自己的职业路径——一个看得见的晋升阶梯比舒适的环境对你更重要。');
  } else if (sc.pctAM <= 35) {
    lines.push('工作与生活的平衡对你来说比「爬到最高处」更重要。一份能给你稳定感和足够个人时间的工作，可能比一个高强度高回报的岗位更适合你。');
  }

  return lines.join('');
}

// ============================================================
//  展示结果
// ============================================================
function showResult() {
  var sc = calcScores();
  var baseType = sc.type.replace('-A','').replace('-T','');
  var td = typeData[baseType];

  document.getElementById('res-code').textContent = sc.type;
  document.getElementById('res-name').textContent = td.name + '型';
  document.getElementById('res-sub').textContent = sc.assertive ? '自信稳定型 · ' + td.sub : '敏感内省型 · ' + td.sub;

  var dims = [
    { left:'I 内向', right:'外向 E', pct:sc.pctEI, color:'#667eea' },
    { left:'N 直觉', right:'感觉 S', pct:sc.pctSN, color:'#f093fb' },
    { left:'F 情感', right:'思考 T', pct:sc.pctTF, color:'#f5576c' },
    { left:'P 感知', right:'判断 J', pct:sc.pctJP, color:'#4facfe' },
    { left:'焦虑敏感', right:'沉着稳定', pct:sc.pctES, color:'#43e97b' },
    { left:'随遇而安', right:'目标驱动', pct:sc.pctAM, color:'#fbbf24' }
  ];
  var dh = '<h3>📊 六维分析</h3>';
  for (var i = 0; i < dims.length; i++) {
    var d = dims[i];
    var bc = d.pct < 50 ? '#e53e3e' : d.color;
    dh += '<div class="dim-row">';
    dh += '<div class="dim-head"><span class="dim-left">' + d.left + '</span><span class="dim-right">' + d.right + '</span></div>';
    dh += '<div class="dim-track"><div class="dim-mid"></div><div class="dim-fill" style="width:' + d.pct + '%;background:' + bc + '"></div></div>';
    dh += '</div>';
  }
  document.getElementById('res-dims').innerHTML = dh;

  // 在解读中加入A/T维度的补充说明
  var atNote = sc.assertive ?
    '此外，你在情绪稳定性维度上得分较高（-A 型），这意味着面对压力和不确定性时，你通常能保持冷静和自信，不太容易自我怀疑。' :
    '此外，你在情绪稳定性维度上得分偏低（-T 型），这意味着你对自己有较高的要求，容易感知到情绪波动，但也因此更有自我觉察力和进步的动力。';
  document.getElementById('res-desc').textContent = td.desc + ' ' + atNote;
  document.getElementById('res-str').textContent = td.str;
  document.getElementById('res-grow').textContent = td.grow;
  document.getElementById('res-career').innerHTML =
    '<div style="margin-bottom:8px;">' + generateCareerAdvice(sc) + '</div>' +
    '<div style="font-size:13px;color:#718096;margin-top:10px;padding-top:10px;border-top:1px dashed #e2e8f0;">📌 适合探索的方向：' + td.career + '</div>';

  var th = '';
  for (var j = 0; j < td.tags.length; j++) {
    th += '<span class="tag">' + td.tags[j] + '</span>';
  }
  // 加A/T标签
  th += sc.assertive ? '<span class="tag" style="background:#e6ffed;color:#22543d;">自信稳定-A</span>' : '<span class="tag" style="background:#fff5f5;color:#9b2c2c;">敏感内省-T</span>';
  document.getElementById('res-tags').innerHTML = th;

  showPg('result');
  window.scrollTo({ top: 0, behavior: 'smooth' });

  // 条形图动画
  var fills = document.querySelectorAll('#res-dims .dim-fill');
  for (var k = 0; k < fills.length; k++) {
    var el = fills[k];
    var w = el.style.width;
    el.style.width = '0';
    (function(e, wd) { setTimeout(function() { e.style.width = wd; }, 150); })(el, w);
  }
}

// ============================================================
//  保存为图片（动态加载 html2canvas）
// ============================================================
function saveImage() {
  if (typeof html2canvas !== 'undefined') {
    captureAndDownload();
    return;
  }
  var btn = document.getElementById('btn-save');
  btn.textContent = '⏳ 正在加载组件...';
  btn.disabled = true;
  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
  script.onload = function() {
    btn.textContent = '📸 保存结果为图片';
    btn.disabled = false;
    captureAndDownload();
  };
  script.onerror = function() {
    btn.textContent = '📸 保存结果为图片';
    btn.disabled = false;
    alert('图片保存组件加载失败，请检查网络后重试。');
  };
  document.head.appendChild(script);
}

function captureAndDownload() {
  var sc = calcScores();
  var baseType = sc.type.replace('-A','').replace('-T','');
  var td = typeData[baseType];
  var dims = [
    { left:'I 内向', right:'外向 E', pct:sc.pctEI },
    { left:'N 直觉', right:'感觉 S', pct:sc.pctSN },
    { left:'F 情感', right:'思考 T', pct:sc.pctTF },
    { left:'P 感知', right:'判断 J', pct:sc.pctJP },
    { left:'焦虑敏感', right:'沉着稳定', pct:sc.pctES },
    { left:'随遇而安', right:'目标驱动', pct:sc.pctAM }
  ];
  var dh = '';
  for (var i = 0; i < dims.length; i++) {
    var d = dims[i];
    dh += '<div style="margin-bottom:10px;font-size:13px;">';
    dh += '<div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span style="color:#e53e3e;font-weight:700;">'+d.left+'</span><span style="color:#3182ce;font-weight:700;">'+d.right+'</span></div>';
    dh += '<div style="height:10px;background:#edf2f7;border-radius:5px;overflow:hidden;position:relative;">';
    dh += '<div style="position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;background:#cbd5e0;"></div>';
    dh += '<div style="height:100%;width:'+d.pct+'%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:5px;"></div></div></div>';
  }
  var th = '';
  for (var j = 0; j < td.tags.length; j++) {
    th += '<span style="display:inline-block;background:#f0edff;color:#6b46c1;font-size:12px;font-weight:700;padding:5px 14px;border-radius:20px;margin:3px;">'+td.tags[j]+'</span>';
  }
  var cap = document.getElementById('capture-area');
  cap.innerHTML =
    '<div style="text-align:center;margin-bottom:22px;">'+
    '<div style="font-size:50px;font-weight:900;letter-spacing:5px;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">'+sc.type+'</div>'+
    '<div style="font-size:24px;font-weight:800;color:#1a202c;margin:4px 0;">'+td.name+'型</div>'+
    '<div style="font-size:14px;color:#718096;">'+td.sub+'</div></div>'+
    '<div style="background:#fafafa;border-radius:14px;padding:18px;margin-bottom:12px;"><div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:10px;">📊 六维分析</div>'+dh+'</div>'+
    '<div style="background:#fafafa;border-radius:14px;padding:18px;margin-bottom:12px;"><div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:8px;">📖 性格解读</div><div style="font-size:14px;color:#4a5568;line-height:1.8;">'+td.desc+'</div><div style="margin-top:10px;">'+th+'</div></div>'+
    '<div style="display:flex;gap:10px;margin-bottom:12px;"><div style="flex:1;background:#fafafa;border-radius:14px;padding:18px;"><div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:6px;">💪 优势</div><div style="font-size:13px;color:#4a5568;line-height:1.7;">'+td.str+'</div></div><div style="flex:1;background:#fafafa;border-radius:14px;padding:18px;"><div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:6px;">🌱 成长盲区</div><div style="font-size:13px;color:#4a5568;line-height:1.7;">'+td.grow+'</div></div></div>'+
    '<div style="background:#fafafa;border-radius:14px;padding:18px;margin-bottom:12px;"><div style="font-size:15px;font-weight:700;color:#2d3748;margin-bottom:6px;">💼 职业分析</div><div style="font-size:13px;color:#4a5568;line-height:1.7;">'+generateCareerAdvice(sc)+'</div><div style="font-size:12px;color:#718096;margin-top:8px;padding-top:8px;border-top:1px dashed #e2e8f0;">📌 参考方向：'+td.career+'</div></div>'+
    '<div style="text-align:center;font-size:11px;color:#cbd5e0;margin-top:14px;">MBTI 性格测试 · '+new Date().toLocaleDateString('zh-CN')+'</div>';

  html2canvas(cap, { backgroundColor:'#ffffff', scale:2, useCORS:true, logging:false }).then(function(canvas) {
    var a = document.createElement('a');
    a.download = 'MBTI性格测试_'+sc.type+'_'+td.name+'.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
  }).catch(function() { alert('截图失败，请重试。'); });
}
