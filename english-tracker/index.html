<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F5F0E8">
<title>英语学习工作台</title>
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:       #F5F0E8;
  --card:     #FFFDF9;
  --brown:    #C4A882;
  --brown-lt: #E8D9C8;
  --blue:     #8FA7B6;
  --blue-lt:  #DCE8EF;
  --blue-dk:  #6B8A9A;
  --text:     #4A3F38;
  --text-lt:  #9B8E82;
  --text-xlt: #C4B8AC;
  --green:    #7BA58F;
  --green-lt: #E4F0E9;
  --red:      #C4908A;
  --red-lt:   #F5E8E6;
  --warn:     #D4B87A;
  --radius:   16px;
  --shadow:   0 2px 16px rgba(74,63,56,0.06);
  --line:     1px solid #E8E0D5;
}

body{
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  min-height:100vh; min-height:100dvh;
  display:flex; justify-content:center;
  -webkit-tap-highlight-color:transparent;
  font-size:16px; line-height:1.6;
}
.app{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;position:relative;overflow:hidden}
.page{display:none;flex-direction:column;flex:1;overflow-y:auto;padding:20px 16px 120px}
.page.active{display:flex}
.page{animation:fadePage .25s ease}
@keyframes fadePage{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Top bar */
.topbar{padding:24px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
.greeting{font-size:13px;color:var(--text-lt);margin-bottom:2px}
.date-big{font-size:22px;font-weight:700;color:var(--text)}
.streak-badge{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--brown);box-shadow:var(--shadow)}

/* Progress ring */
.progress-wrap{display:flex;justify-content:center;margin:12px 0}
.progress-ring{position:relative;width:110px;height:110px}
.progress-ring svg{transform:rotate(-90deg);width:110px;height:110px}
.progress-ring .bg{fill:none;stroke:#E8E0D5;stroke-width:7}
.progress-ring .fill{fill:none;stroke:var(--brown);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.progress-ring .txt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;line-height:1.2}
.progress-ring .txt .pct{font-size:24px;font-weight:800;color:var(--brown)}
.progress-ring .txt .sub{font-size:10px;color:var(--text-lt);display:block}

/* Section titles */
.sec-title{font-size:14px;font-weight:700;color:var(--text-lt);margin:20px 0 10px;letter-spacing:.5px}
.sec-title span{margin-right:4px}

/* Task cards */
.task-list{display:flex;flex-direction:column;gap:10px}
.task-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;border:1px solid transparent;transition:all .2s}
.task-card.done{border-color:var(--green);background:var(--green-lt)}
.task-card .t-icon{font-size:28px;flex-shrink:0}
.task-card .t-info{flex:1;min-width:0}
.task-card .t-name{font-size:16px;font-weight:700}
.task-card .t-meta{font-size:12px;color:var(--text-lt);margin-top:2px}
.task-card .t-check{width:26px;height:26px;border-radius:50%;border:2px solid #D8CFC0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .2s;cursor:pointer}
.task-card .t-check.done{background:var(--green);border-color:var(--green);color:#fff}
.task-card .t-check:active{transform:scale(.9)}

/* Quick action buttons */
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.quick-btn{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);border:none;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.quick-btn:active{background:var(--blue-lt);transform:scale(.98)}
.quick-btn .qb-icon{font-size:22px;display:block;margin-bottom:4px}

/* Bottom nav */
.nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:var(--line);display:flex;padding:6px 12px;padding-bottom:max(6px, env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:10px;font-size:11px;font-weight:600;color:var(--text-xlt);cursor:pointer;transition:all .15s}
.nav-item.active{color:var(--brown)}
.nav-item .ni-icon{font-size:20px}

/* ===== Listening Page ===== */
.audio-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.audio-card .ac-type{font-size:11px;color:var(--blue-dk);font-weight:700;background:var(--blue-lt);display:inline-block;padding:2px 10px;border-radius:10px;margin-bottom:10px}
.audio-card .ac-title{font-size:17px;font-weight:700;margin-bottom:6px;line-height:1.5}
.audio-card .ac-meta{font-size:12px;color:var(--text-lt);margin-bottom:14px}
.audio-card .ac-text{font-size:15px;line-height:1.8;color:var(--text);padding:14px;background:#FAF7F2;border-radius:12px;max-height:300px;overflow-y:auto;white-space:pre-wrap;margin-bottom:14px}
.audio-card .ac-text.hidden-text{color:transparent;text-shadow:0 0 20px rgba(74,63,56,.8)}
.audio-card .ac-text.hidden-text span{visibility:hidden}

/* Audio controls */
.audio-ctrl{display:flex;align-items:center;gap:10px;padding:10px 0}
.btn-play{width:44px;height:44px;border-radius:50%;background:var(--brown);border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;transition:all .15s}
.btn-play:active{transform:scale(.93)}
.btn-play.playing{background:var(--blue-dk)}
.progress-bar{flex:1;height:6px;background:#E8E0D5;border-radius:3px;overflow:hidden;position:relative}
.progress-bar .bar-fill{height:100%;background:var(--brown);border-radius:3px;transition:width .1s linear;width:0%}
.time-lbl{font-size:11px;color:var(--text-lt);width:36px;text-align:center;flex-shrink:0}

.speed-btns{display:flex;gap:6px;margin:8px 0}
.speed-btn{padding:6px 14px;border-radius:14px;border:1px solid var(--brown-lt);background:#fff;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s}
.speed-btn.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.speed-btn:active{transform:scale(.95)}

.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.row-btn{padding:8px 16px;border-radius:20px;border:1px solid var(--brown-lt);background:var(--card);font-size:13px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s}
.row-btn.active{background:var(--blue-lt);border-color:var(--blue);color:var(--blue-dk)}
.row-btn:active{transform:scale(.96)}

/* Dictation */
.dict-input{width:100%;padding:14px;border:2px solid #E8E0D5;border-radius:var(--radius);font-size:16px;font-family:inherit;resize:none;margin:10px 0;background:var(--card);color:var(--text)}
.dict-input:focus{outline:none;border-color:var(--brown)}
.dict-result{padding:12px;border-radius:12px;font-size:14px;line-height:1.8;margin-top:8px}
.dict-result .correct{color:var(--green)}
.dict-result .wrong{color:var(--red);text-decoration:line-through}

/* ===== Speaking Page ===== */
.record-card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.step-indicator{display:flex;gap:4px;margin-bottom:16px}
.step-dot{flex:1;height:4px;background:#E8E0D5;border-radius:2px}
.step-dot.done{background:var(--green)}
.step-dot.current{background:var(--brown)}
.step-label{font-size:12px;color:var(--text-lt);margin-bottom:14px}
.practice-text{font-size:17px;line-height:2;padding:16px;background:#FAF7F2;border-radius:var(--radius);margin-bottom:14px;letter-spacing:.5px}
.practice-text .highlight{background:#FFE8D0;padding:2px 0;border-radius:2px}
.btn-record{width:100%;padding:16px;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;cursor:pointer;transition:all .15s;background:var(--blue);color:#fff}
.btn-record:active{transform:scale(.97)}
.btn-record.recording{background:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.score-display{text-align:center;padding:16px;font-size:48px;font-weight:800;color:var(--brown)}
.score-display .slbl{font-size:12px;color:var(--text-lt);display:block}

/* ===== Vocab Page ===== */
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tag{font-size:12px;padding:6px 14px;border-radius:14px;border:1px solid var(--brown-lt);background:var(--card);color:var(--text-lt);cursor:pointer;font-weight:600;transition:all .15s}
.tag.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.vocab-item{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:8px;position:relative}
.vocab-item .v-phrase{font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px}
.vocab-item .v-phonetic{font-size:12px;color:var(--blue-dk);margin-bottom:4px}
.vocab-item .v-meaning{font-size:14px;color:var(--text-lt)}
.vocab-item .v-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--blue-lt);color:var(--blue-dk);margin-top:6px}
.vocab-item .v-row{display:flex;align-items:center;justify-content:space-between}
.vocab-item .v-actions{display:flex;gap:6px;flex-shrink:0}
.v-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--brown-lt);background:var(--card);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent}
.v-btn:active{transform:scale(.9)}
.v-btn.playing{background:var(--brown);color:#fff}
.v-btn.mastered{background:var(--green);border-color:var(--green);color:#fff}
.v-btn.unmastered{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.vocab-item.mastered{border-left:3px solid var(--green);opacity:.7}
.vocab-item.mastered .v-phrase{color:var(--green)}
.plan-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.plan-month{font-size:15px;font-weight:700;color:var(--brown);margin-bottom:6px}
.plan-focus{font-size:13px;color:var(--text-lt);line-height:1.6}
.plan-progress{height:6px;background:#E8E0D5;border-radius:3px;margin-top:8px;overflow:hidden}
.plan-progress .pp-fill{height:100%;background:var(--brown);border-radius:3px;transition:width .4s}

/* ===== Review Page ===== */
.heatmap-wrap{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.heatmap-title{font-size:14px;font-weight:700;margin-bottom:10px;color:var(--text)}
.heatmap{display:flex;flex-wrap:wrap;gap:3px}
.heat-dot{width:15px;height:15px;border-radius:3px;background:#EBE4D8}
.heat-dot.l1{background:var(--brown-lt)}
.heat-dot.l2{background:var(--brown)}
.heat-dot.l3{background:#A08463}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow)}
.stat-card .sn{font-size:30px;font-weight:800;color:var(--brown)}
.stat-card .sl{font-size:12px;color:var(--text-lt);margin-top:2px}
.week-chart{display:flex;align-items:flex-end;gap:8px;background:var(--card);border-radius:var(--radius);padding:20px 16px;box-shadow:var(--shadow);height:140px;margin-bottom:16px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{width:100%;max-width:32px;border-radius:6px 6px 0 0;background:var(--brown);min-height:4px;transition:height .4s;opacity:.7}
.bar.today{opacity:1;background:var(--blue-dk)}
.bar-label{font-size:11px;color:var(--text-lt)}
.bar-min{font-size:10px;color:var(--text-xlt)}

/* Settings in review page */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:var(--line)}
.setting-row .sr-label{font-size:15px;font-weight:600}
.setting-row .sr-sub{font-size:12px;color:var(--text-lt)}
.toggle-sw{width:46px;height:26px;border-radius:13px;background:#D8CFC0;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle-sw.on{background:var(--blue)}
.toggle-sw::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle-sw.on::after{transform:translateX(20px)}

/* Toast */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}

/* Confetti */
.confetti{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:99;display:none}
.confetti.show{display:block;animation:fadeOut 2s ease forwards}
@keyframes fadeOut{0%,70%{opacity:1}100%{opacity:0}}
.particle{position:absolute;width:8px;height:8px;border-radius:2px;animation:fall 1.5s ease-out forwards}
@keyframes fall{0%{transform:translateY(-60px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ===== Page: Home 首页任务 ===== -->
<div class="page active" id="page-home">
  <div class="topbar">
    <div>
      <div class="greeting" id="greeting"></div>
      <div class="date-big" id="dateBig"></div>
    </div>
    <div class="streak-badge">🔥 <span id="streakTop">0</span>天</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-ring">
      <svg viewBox="0 0 110 110"><circle class="bg" cx="55" cy="55" r="48"/><circle class="fill" id="ringFill" cx="55" cy="55" r="48" stroke-dasharray="301.59" stroke-dashoffset="301.59"/></svg>
      <div class="txt"><span class="pct" id="ringPct">0%</span><span class="sub" id="ringSub">0/35 min</span></div>
    </div>
  </div>

  <div class="sec-title"><span>📋</span>今日自动生成任务（共4项·35分钟）</div>
  <div class="task-list" id="taskList"></div>

  <div class="quick-actions">
    <button class="quick-btn" data-nav="listening"><span class="qb-icon">🎧</span>今日听力</button>
    <button class="quick-btn" data-nav="speaking"><span class="qb-icon">🗣️</span>口语跟读</button>
    <button class="quick-btn" data-nav="vocab"><span class="qb-icon">📝</span>词句本</button>
    <button class="quick-btn" data-nav="review"><span class="qb-icon">📊</span>错题复盘</button>
  </div>
</div>

<!-- ===== Page: Listening 听力库 ===== -->
<div class="page" id="page-listening">
  <div class="sec-title"><span>🎧</span>今日听力任务</div>
  <div class="audio-card" id="listeningCard">
    <div class="ac-type" id="listenType">职场精听短文</div>
    <div class="ac-title" id="listenTitle"></div>
    <div class="ac-meta" id="listenMeta"></div>

    <!-- Controls -->
    <div class="audio-ctrl">
      <button class="btn-play" id="btnPlayAudio">▶</button>
      <div class="progress-bar" id="progressBarWrap"><div class="bar-fill" id="barFill"></div></div>
      <span class="time-lbl" id="timeLbl">0:00</span>
    </div>

    <div class="speed-btns">
      <button class="speed-btn" data-rate="0.75">0.75x</button>
      <button class="speed-btn active" data-rate="1.0">1.0x</button>
      <button class="speed-btn" data-rate="1.2">1.2x</button>
    </div>

    <div class="row-btns" style="margin:8px 0">
      <button class="row-btn" id="btnBlindMode">🙈 盲听模式</button>
      <button class="row-btn" id="btnDictMode">✏️ 一键听写</button>
      <button class="row-btn" id="btnABLoop">🔁 AB循环</button>
    </div>

    <!-- Text display -->
    <div class="ac-text" id="listenText"></div>

    <!-- Dictation area -->
    <textarea class="dict-input" id="dictInput" placeholder="在此输入你听到的内容…" style="display:none" rows="3"></textarea>
    <button class="row-btn" id="btnCheckDict" style="display:none;width:100%;margin-top:8px;justify-content:center">✅ 检查拼写</button>
    <div class="dict-result" id="dictResult" style="display:none"></div>
  </div>

  <!-- Conversation cards -->
  <div class="sec-title"><span>💬</span>今日情景对话</div>
  <div id="dialogueCards"></div>
</div>

<!-- ===== Page: Speaking 口语练习 ===== -->
<div class="page" id="page-speaking">
  <div class="step-indicator" id="stepIndicator">
    <div class="step-dot done"></div><div class="step-dot"></div><div class="step-dot"></div>
  </div>
  <div class="step-label" id="stepLabel">第1步：逐句模仿跟读</div>

  <div class="record-card">
    <div class="practice-text" id="practiceText"></div>
    <div id="liveTranscript" style="display:none;font-size:14px;color:var(--blue-dk);background:var(--blue-lt);padding:10px 14px;border-radius:12px;margin-bottom:14px;min-height:20px;line-height:1.6"></div>
    <button class="btn-record" id="btnRecord">🎤 开始跟读录音</button>
    <div class="score-display" id="scoreDisplay" style="display:none"><span class="slbl">发音评分</span>--</div>
  </div>

  <div class="row-btns" style="justify-content:center">
    <button class="row-btn" id="btnPrevStep" disabled>上一步</button>
    <button class="row-btn active" id="btnNextStep">下一步</button>
  </div>
</div>

<!-- ===== Page: Vocab 词句本 ===== -->
<div class="page" id="page-vocab">
  <div class="sec-title"><span>📅</span>年度学习计划</div>
  <div class="plan-card" id="planCard">
    <div class="plan-month" id="planMonth"></div>
    <div class="plan-focus" id="planFocus"></div>
    <div class="plan-progress"><div class="pp-fill" id="planProgressBar"></div></div>
    <div style="font-size:11px;color:var(--text-xlt);margin-top:4px" id="planProgressLabel"></div>
  </div>

  <div class="sec-title"><span>📝</span>今日职场词句（20条）</div>
  <div class="tag-row" id="vocabTags">
    <button class="tag active" data-tag="all">全部</button>
    <button class="tag" data-tag="meeting">会议用语</button>
    <button class="tag" data-tag="email">邮件用语</button>
    <button class="tag" data-tag="client">客户沟通</button>
    <button class="tag" data-tag="softskill">职场软实力</button>
  </div>
  <div id="vocabList"></div>
  <div class="sec-title" style="margin-top:20px"><span>🔄</span>今日待复习（艾宾浩斯）</div>
  <div id="reviewVocabList"></div>
</div>

<!-- ===== Page: Review 个人复盘 ===== -->
<div class="page" id="page-review">
  <div class="heatmap-wrap">
    <div class="heatmap-title">📅 本月学习打卡</div>
    <div class="heatmap" id="heatmap"></div>
  </div>

  <div class="stat-row">
    <div class="stat-card"><div class="sn" id="statDays">0</div><div class="sl">累计天数</div></div>
    <div class="stat-card"><div class="sn" id="statMins">0h</div><div class="sl">累计时长</div></div>
    <div class="stat-card"><div class="sn" id="statAvg">0</div><div class="sl">日均(分钟)</div></div>
    <div class="stat-card"><div class="sn" id="statBest">0</div><div class="sl">最长连续</div></div>
  </div>

  <div style="background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;">
    <div class="heatmap-title">📊 本周学习时长</div>
    <div class="week-chart" id="weekChart"></div>
  </div>

  <div style="background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px;">
    <div class="heatmap-title">📋 本周薄弱分析</div>
    <div id="weaknessReport" style="font-size:14px;color:var(--text-lt);line-height:1.8"></div>
  </div>

  <div class="sec-title">⚙️ 设置</div>
  <div style="background:var(--card);border-radius:var(--radius);padding:4px 16px;box-shadow:var(--shadow)">
    <div class="setting-row">
      <div><div class="sr-label">🗣️ 口音偏好</div><div class="sr-sub">听力素材优先推送</div></div>
      <div style="display:flex;gap:6px">

<script>
// =============================================
// DATA LAYER
// =============================================
const STORAGE_KEY = 'eng_app_data';

const WEEK_THEMES = [
  '远程办公与职场效率','会议沟通英文表达','客户对接与商务谈判',
  '工作汇报与项目进度','职场软实力与时间管理','日常社交与跨文化交流','泛听美文与自由复述'
];


function getDayIndex() {
  const d = new Date();
  const start = new Date(d.getFullYear(), 0, 0);
  const diff = d - start;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

function getTodayContent() {
  const idx = getDayIndex();
  const dow = new Date().getDay();
  const topicIdx = dow === 0 ? 6 : dow - 1;
  const currentMonth = new Date().getMonth() + 1;

  let topicPassages = CONTENT_POOL.listening.passages.filter(p => p.topic === topicIdx && p.month === currentMonth);
  if (topicPassages.length === 0) {
    topicPassages = CONTENT_POOL.listening.passages.filter(p => p.topic === topicIdx);
  }
  const passageIdx = Math.floor(idx / 7) % topicPassages.length;
  const passage = topicPassages[passageIdx];

  let monthDialogues = CONTENT_POOL.listening.dialogues.filter(d => d.month === currentMonth);
  if (monthDialogues.length === 0) {
    monthDialogues = CONTENT_POOL.listening.dialogues;
  }
  const dialogue = monthDialogues[idx % monthDialogues.length];

  return { passage, dialogue, topic: WEEK_THEMES[topicIdx], topicIdx, date: todayKey() };
}
function getDefaultData() {
  return {
    records: {},
    settings: { accent:'UK', reminder:true, reminderTime:'20:00' },
    bestStreak: 0,
    mistakeBank: [],
    vocabReviewed: {}
  };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return Object.assign(getDefaultData(), JSON.parse(raw));
  } catch(e) {}
  return getDefaultData();
}

function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getOrCreateToday(data) {
  const key = todayKey();
  if (!data.records[key]) {
    data.records[key] = {
      listening: { done:false, minutes:0 },
      speaking: { done:false, minutes:0, step:1 },
      vocab: { done:false, minutes:0 },
      review: { done:false, minutes:0 },
      checkedIn: false,
      totalMinutes: 0
    };
  }
  return data.records[key];
}

function calcStreak(data) {
  let streak = 0;
  const d = new Date();
  const today = todayKey();
  const todayRec = data.records[today];
  if (todayRec && todayRec.checkedIn) { streak = 1; d.setDate(d.getDate()-1); }
  else { d.setDate(d.getDate()-1); }
  while (true) {
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const rec = data.records[k];
    if (rec && rec.checkedIn) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  if (streak > (data.bestStreak || 0)) data.bestStreak = streak;
  return streak;
}

// =============================================
// AUDIO ENGINE (TTS-based)
// =============================================
let audioCtx = null;
let currentUtterance = null;
let audioRate = 1.0;
let isPlaying = false;
let isBlindMode = false;
let currentSentenceIdx = 0;
let sentences = [];
let abLoopActive = false;
let abStart = null, abEnd = null;

function splitSentences(text) {
  return text.match(/[^.!?]+[.!?]+/g) || [text];
}

function speakText(text, rate) {
  return new Promise((resolve) => {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = rate;
    u.lang = data.settings.accent === 'US' ? 'en-US' : 'en-GB';
    u.onend = resolve;
    u.onerror = resolve;
    window.speechSynthesis.speak(u);
    currentUtterance = u;
  });
}

function stopSpeech() {
  window.speechSynthesis.cancel();
  isPlaying = false;
  updatePlayBtn();
}

// =============================================
// RENDER: Home Page
// =============================================
function renderHome() {
  const data = loadData();
  const today = getOrCreateToday(data);
  saveData(data);

  // Greeting
  const h = new Date().getHours();
  const greet = h < 12 ? '早安' : h < 18 ? '午安' : '晚间学习时间';
  document.getElementById('greeting').textContent = `☀️ ${greet}，今天也要加油`;

  // Date
  const d = new Date();
  const wd = ['日','一','二','三','四','五','六'];
  document.getElementById('dateBig').textContent = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${wd[d.getDay()]}`;
  document.getElementById('streakTop').textContent = calcStreak(data);
  saveData(data);

  // Progress ring
  const goal = 35;
  const mins = today.totalMinutes || 0;
  const pct = Math.min(100, Math.round(mins / goal * 100));
  const circ = 301.59;
  document.getElementById('ringFill').style.strokeDashoffset = circ - (circ * pct / 100);
  document.getElementById('ringPct').textContent = pct + '%';
  document.getElementById('ringSub').textContent = mins + '/35 min';

  // Task list
  const tasks = [
    {id:'listening',icon:'🎧',name:'听力精听任务',meta:'1篇职场短文 + 2段情景对话',time:12},
    {id:'speaking',icon:'🗣️',name:'口语跟读复述',meta:'全文跟读 → 脱稿复述',time:15},
    {id:'vocab',icon:'📝',name:'职场高频词句巩固',meta:'20个短语/搭配',time:5},
    {id:'review',icon:'🔄',name:'薄弱点复盘',meta:'昨日错题重练',time:3},
  ];

  document.getElementById('taskList').innerHTML = tasks.map(t => {
    const done = today[t.id] ? today[t.id].done : false;
    return `
      <div class="task-card${done?' done':''}" data-task="${t.id}">
        <div class="t-icon">${t.icon}</div>
        <div class="t-info"><div class="t-name">${t.name}</div><div class="t-meta">${t.meta} · ${t.time}分钟</div></div>
        <div class="t-check${done?' done':''}" data-task="${t.id}">✓</div>
      </div>`;
  }).join('');

  // Bind task clicks
  document.querySelectorAll('.t-check').forEach(el => {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      const taskId = this.dataset.task;
      const d = loadData();
      const t = getOrCreateToday(d);
      if (!t[taskId]) t[taskId] = {done:false, minutes:0};
      t[taskId].done = !t[taskId].done;
      if (t[taskId].done && t[taskId].minutes === 0) {
        const times = {listening:12,speaking:15,vocab:5,review:3};
        t[taskId].minutes = times[taskId] || 0;
      }
      if (!t[taskId].done) t[taskId].minutes = 0;
      t.totalMinutes = 0;
      ['listening','speaking','vocab','review'].forEach(id => {
        if (t[id] && t[id].done) t.totalMinutes += (t[id].minutes || 0);
      });
      if (t.totalMinutes === 35 && !t.checkedIn) { t.checkedIn = true; showConfetti(); showToast('🎉 恭喜！今日学习全部完成！'); }
      saveData(d);
      renderHome();
      if (document.getElementById('page-review').classList.contains('active')) renderReview();
    });
  });

  // Quick action buttons
  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', function() { navigateTo(this.dataset.nav); });
  });
}

// RENDER: Listening Page
// =============================================
let listenSentences = [];
let currentSentIdx = 0;

function renderListening() {
  const content = getTodayContent();
  const p = content.passage;

  document.getElementById('listenTitle').textContent = p.title;

  document.getElementById('listenText').textContent = p.text;
  document.getElementById('listenText').classList.remove('hidden-text');
  document.getElementById('dictInput').style.display = 'none';
  document.getElementById('btnCheckDict').style.display = 'none';
  document.getElementById('dictResult').style.display = 'none';
  listenSentences = splitSentences(p.text);
  currentSentIdx = 0;
  isBlindMode = false;
  stopSpeech();

  // Dialogues
  const dlg = content.dialogue;
  document.getElementById('dialogueCards').innerHTML = `
    <div class="audio-card">
      <div class="ac-type">职场情景对话</div>

      <div class="ac-meta">${dlg.speakerA} & ${dlg.speakerB} · 双人对话</div>
      <div class="ac-text">${dlg.lines.map(l=>`<b>${l.s}:</b> ${l.t}`).join('\n')}</div>
    </div>`;
}

// Play full passage
document.addEventListener('click', function(e) {
  if (e.target.id === 'btnPlayAudio') {
    const btn = document.getElementById('btnPlayAudio');

    isPlaying = true;
    btn.textContent = '⏸';

});

function updatePlayBtn() {

document.addEventListener('click', function(e) {
  if (e.target.classList.contains('speed-btn')) {

document.addEventListener('click', function(e) {

// Dictation mode
document.addEventListener('click', function(e) {
  if (e.target.id === 'btnDictMode') {
    const inputEl = document.getElementById('dictInput');
    const checkBtn = document.getElementById('btnCheckDict');
    const resultEl = document.getElementById('dictResult');
    const textEl = document.getElementById('listenText');
    const isShowing = inputEl.style.display === 'block';
    inputEl.style.display = isShowing ? 'none' : 'block';
    checkBtn.style.display = isShowing ? 'none' : 'block';
    resultEl.style.display = 'none';
    if (!isShowing) { textEl.classList.add('hidden-text'); inputEl.value = ''; inputEl.focus(); }
    else { textEl.classList.remove('hidden-text'); }
  }
});

// Check dictation
document.addEventListener('click', function(e) {
  if (e.target.id === 'btnCheckDict') {
    const userText = document.getElementById('dictInput').value.trim();
    const original = document.getElementById('listenText').textContent.trim();
    const resultEl = document.getElementById('dictResult');
    resultEl.style.display = 'block';

    if (!userText) { resultEl.innerHTML = '<span style="color:var(--red)">请输入听写内容</span>'; return; }

    const userWords = userText.split(/\s+/);
    const origWords = original.split(/\s+/);
    let html = '';
    const maxLen = Math.max(userWords.length, origWords.length);
    for (let i = 0; i < maxLen; i++) {
      const uw = userWords[i] || '';
      const ow = origWords[i] || '';
      if (uw.toLowerCase() === ow.toLowerCase()) {
        html += `<span class="correct">${ow} </span>`;
      } else {
        html += `<span class="wrong">${uw || '___'}</span> <span style="color:var(--green);font-size:12px">(${ow})</span> `;
        // Auto-add to mistake bank
        const d = loadData();
        if (!d.mistakeBank) d.mistakeBank = [];
        if (!d.mistakeBank.find(m => m.word === ow && m.date === todayKey())) {
          d.mistakeBank.push({word:ow, userInput:uw, type:'dictation', date:todayKey(), passage:original.substring(0,50)+'...'});
          saveData(d);
        }
      }
    }
    resultEl.innerHTML = html;
    const d = loadData();
    const today = getOrCreateToday(d);
    today.listening.done = true;
    today.listening.minutes = 12;
    today.totalMinutes = (today.totalMinutes||0) + (today.listening.done?0:12);
    saveData(d);
    showToast('听写完成！错词已自动加入错题本');
  }
});

// AB Loop
document.addEventListener('click', function(e) {
  if (e.target.id === 'btnABLoop') {
    abLoopActive = !abLoopActive;
    e.target.classList.toggle('active', abLoopActive);

      showToast('请在文中选定起点和终点（点击句子）');

      abStart = null; abEnd = null;
    }

});

// =============================================
// RENDER: Speaking Page
// =============================================
let speakStep = 1;
let mediaRecorder = null;
let recordedChunks = [];

function renderSpeaking() {
  const content = getTodayContent();
  const p = content.passage;
  const stepLabels = ['第1步：逐句模仿跟读','第2步：全文连贯朗读','第3步：脱稿复述挑战'];
  document.getElementById('stepLabel').textContent = stepLabels[speakStep-1];

  // Step indicator
  document.getElementById('stepIndicator').innerHTML = [1,2,3].map(s =>
    `<div class="step-dot${s < speakStep ? ' done' : ''}${s === speakStep ? ' current' : ''}"></div>`
  ).join('');

  // Practice text
  const textEl = document.getElementById('practiceText');
  if (speakStep === 3) {
    // Retelling - show Chinese hints only
    const hints = ['远程办公/职场效率','会议沟通/邮件表达','商务谈判/项目跟进'];
    textEl.innerHTML = `<div style="font-size:14px;color:var(--text-lt);margin-bottom:8px">📌 中文提示（请根据要点口头复述英文内容）</div>
      <div style="font-size:18px;line-height:2.2">${hints[getDayIndex()%3]}<br>请根据以上主题，脱稿复述1-2分钟</div>`;
  } else {
    textEl.innerHTML = p.text.split(/(?<=[.!?])\s+/).map((s,i) =>
      `<span class="${i===currentSentIdx&&speakStep===1?'highlight':''}">${s.trim()} </span>`
    ).join('');
  }

  // Prev/Next buttons
  document.getElementById('btnPrevStep').disabled = speakStep <= 1;
  document.getElementById('btnNextStep').textContent = speakStep >= 3 ? '完成练习' : '下一步';

  // Score display
  document.getElementById('scoreDisplay').style.display = 'none';
  document.getElementById('btnRecord').textContent = '🎤 开始跟读录音';
  document.getElementById('btnRecord').classList.remove('recording');
}

// ============== Speech Recognition Engine ==============
let recognition = null;
let recognizedText = '';

function getSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return null;
  const rec = new SpeechRecognition();
  rec.lang = data.settings.accent === 'US' ? 'en-US' : 'en-GB';
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  return rec;
}

function compareTexts(spoken, target) {
  const spokenWords = spoken.toLowerCase().replace(/[^\w\s']/g, '').split(/\s+/).filter(Boolean);
  const targetWords = target.toLowerCase().replace(/[^\w\s']/g, '').split(/\s+/).filter(Boolean);
  if (targetWords.length === 0) return { score: 0, html: '<span style="color:var(--red)">无目标文本</span>' };

  let matched = 0;
  const resultHtml = targetWords.map(tw => {
    const found = spokenWords.includes(tw);
    if (found) matched++;
    return found
      ? `<span style="color:var(--green)">${tw}</span>`
      : `<span style="color:var(--red);text-decoration:underline">${tw}</span>`;
  }).join(' ');

  // Weighted score: 60% accuracy + 40% completeness
  const accuracy = matched / Math.max(1, spokenWords.length);
  const completeness = matched / targetWords.length;
  const score = Math.round((accuracy * 0.4 + completeness * 0.6) * 100);

  return { score: Math.min(100, score), html: resultHtml };
}

// Record button — uses real speech recognition
document.addEventListener('click', function(e) {
  if (e.target.id === 'btnRecord') {
    const btn = e.target;
    if (btn.classList.contains('recording')) {
      // === STOP RECORDING ===
      if (recognition) { recognition.stop(); recognition = null; }
      if (mediaRecorder && mediaRecorder.state === 'recording') { mediaRecorder.stop(); }
      btn.classList.remove('recording');
      btn.textContent = '🎤 开始跟读录音';

      // Compute real score from recognized text
      const targetText = document.getElementById('practiceText').textContent.replace(/\s+/g, ' ').trim();
      const display = document.getElementById('scoreDisplay');
      display.style.display = 'block';

      if (recognizedText.trim()) {
        const result = compareTexts(recognizedText, targetText);
        display.innerHTML = `<span class="slbl">${speakStep===3?'流利度':'发音'}评分</span>${result.score}
          <div style="font-size:11px;color:var(--text-lt);margin-top:4px">你说: "${recognizedText}"</div>
          <div style="font-size:10px;margin-top:8px;line-height:1.6;max-height:120px;overflow-y:auto">${result.html}</div>`;
        showToast(result.score >= 80 ? `👍 ${result.score}分！发音很棒` : result.score >= 60 ? `📖 ${result.score}分，继续练习` : `💪 ${result.score}分，再试一次吧`);
      } else {
        display.innerHTML = `<span class="slbl">未检测到语音</span><span style="font-size:14px">😕</span>
          <div style="font-size:11px;color:var(--text-lt);margin-top:4px">请靠近麦克风，大声朗读</div>`;
      }

      // Save progress
      const d = loadData();
      const today = getOrCreateToday(d);
      today.speaking.done = true;
      today.speaking.step = speakStep;
      today.speaking.minutes = 15;
      if (!today.totalMinutes) today.totalMinutes = 0;
      if (!today.speaking._scored) { today.totalMinutes += 15; today.speaking._scored = true; }
      saveData(d);

    } else {
      // === START RECORDING ===
      recognizedText = '';
      const hasSpeechAPI = !!getSpeechRecognition();

      if (!hasSpeechAPI) {
        showToast('当前浏览器不支持语音识别，请使用 Chrome');
        return;
      }

      // Start speech recognition
      recognition = getSpeechRecognition();
      recognition.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            recognizedText += ' ' + event.results[i][0].transcript;
          } else {
            interim += event.results[i][0].transcript;
          }
        }
        // Show live transcription below the practice text
        const liveEl = document.getElementById('liveTranscript');
        if (liveEl) {
          liveEl.textContent = recognizedText + ' ' + interim;
          liveEl.style.display = 'block';
        }
      };
      recognition.onerror = (event) => {
        if (event.error === 'no-speech') {
          // Just wait, user might not have started speaking yet
        } else if (event.error === 'aborted') {
          // Normal when we stop
        } else {
          showToast('识别错误: ' + event.error);
        }
      };
      recognition.onend = () => {
        const liveEl = document.getElementById('liveTranscript');
        if (liveEl) liveEl.style.display = 'none';
      };
      recognition.start();

      // Also record audio for playback
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({audio:true}).then(stream => {
          recordedChunks = [];
          mediaRecorder = new MediaRecorder(stream, {mimeType:'audio/webm'});
          mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, {type:'audio/webm'});
            const url = URL.createObjectURL(blob);
            const d = loadData();
            if (!d._recordings) d._recordings = {};
            const key = todayKey();
            if (!d._recordings[key]) d._recordings[key] = [];
            d._recordings[key].push({step:speakStep, url:url, time:new Date().toISOString()});
            saveData(d);
            stream.getTracks().forEach(t => t.stop());
          };
          mediaRecorder.start();
        }).catch(() => {});
      }

      btn.classList.add('recording');
      btn.textContent = '⏹ 停止录音';
    }
  }
});

// Step navigation
document.addEventListener('click', function(e) {
  if (e.target.id === 'btnNextStep') {
    if (speakStep >= 3) {
      speakStep = 1;
      showToast('✅ 口语练习完成！');
      const d = loadData();
      const today = getOrCreateToday(d);
      today.speaking.done = true;
      today.speaking.minutes = 15;
      today.totalMinutes = (today.totalMinutes||0) + 15;
      saveData(d);
    } else {
      speakStep++;
    }
    renderSpeaking();
  }
  if (e.target.id === 'btnPrevStep') {
    if (speakStep > 1) { speakStep--; renderSpeaking(); }
  }
});

// =============================================
// RENDER: Vocab Page
// =============================================
let vocabFilter = 'all';
let vocabRecognition = null;
let vocabRecognizingIdx = -1;

function getTodayPhrases() {
  const idx = getDayIndex();
  const allPhrases = [];
  Object.entries(DEFAULT_PHRASES).forEach(([tag, phrases]) => {
    phrases.forEach(p => allPhrases.push({...p, tag}));
  });
  const start = (idx * 5) % allPhrases.length;
  const selected = [];
  for (let i = 0; i < 20; i++) {
    selected.push(allPhrases[(start + i) % allPhrases.length]);
  }
  return selected;
}

function isPhraseMastered(phrase) {
  const d = loadData();
  if (!d._masteredPhrases) d._masteredPhrases = {};
  return !!d._masteredPhrases[phrase.en];
}

function togglePhraseMastered(phrase) {
  const d = loadData();
  if (!d._masteredPhrases) d._masteredPhrases = {};
  if (d._masteredPhrases[phrase.en]) {
    delete d._masteredPhrases[phrase.en];
  } else {
    d._masteredPhrases[phrase.en] = true;
  }
  saveData(d);
  renderVocab();
}

function speakPhrase(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.85;
  u.lang = data.settings.accent === 'US' ? 'en-US' : 'en-GB';
  window.speechSynthesis.speak(u);
}

function startVocabRecognition(idx, phraseEn) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { showToast('请使用 Chrome 浏览器'); return; }

  if (vocabRecognition) { vocabRecognition.stop(); }

  vocabRecognition = new SpeechRecognition();
  vocabRecognition.lang = data.settings.accent === 'US' ? 'en-US' : 'en-GB';
  vocabRecognition.continuous = false;
  vocabRecognition.interimResults = false;

  vocabRecognizingIdx = idx;
  vocabRecognition.onresult = (event) => {
    const spoken = event.results[0][0].transcript.toLowerCase().replace(/[^\w\s']/g, '').trim();
    const target = phraseEn.toLowerCase().replace(/[^\w\s']/g, '').trim();
    const match = spoken === target;
    showToast(match ? '✅ 发音准确！' : `⚠️ 你说的是: "${spoken}"，请再试`);
    vocabRecognizingIdx = -1;
  };
  vocabRecognition.onerror = () => { vocabRecognizingIdx = -1; };
  vocabRecognition.onend = () => { vocabRecognizingIdx = -1; renderVocab(); };
  vocabRecognition.start();
  showToast('🎤 请朗读这个短语...');
}

function renderVocab() {
  const phrases = getTodayPhrases();
  const filtered = vocabFilter === 'all' ? phrases : phrases.filter(p => p.tag === vocabFilter);
  const tagNames = {meeting:'会议用语',email:'邮件用语',client:'客户沟通',softskill:'职场软实力'};

  document.getElementById('vocabList').innerHTML = filtered.map((p, i) => {
    const mastered = isPhraseMastered(p);
    return `
    <div class="vocab-item${mastered?' mastered':''}" id="vocab-${i}">
      <div class="v-row">
        <div style="min-width:0"><div class="v-phrase">${p.en}</div></div>
        <div class="v-actions">
          <button class="v-btn btn-speak" data-idx="${i}" data-text="${p.en.replace(/"/g,'&quot;')}" title="发音">🔊</button>
          <button class="v-btn btn-record-vocab ${vocabRecognizingIdx===i?'playing':''}" data-idx="${i}" data-text="${p.en.replace(/"/g,'&quot;')}" title="跟读">🎤</button>
          <button class="v-btn ${mastered?'mastered':'unmastered'} btn-master" data-idx="${i}" data-text="${p.en.replace(/"/g,'&quot;')}" title="${mastered?'已掌握':'未掌握'}">${mastered?'✅':'❌'}</button>
        </div>
      </div>
      <div class="v-phonetic">${p.ipa || ''}</div>
      <div class="v-meaning">${p.zh}</div>
      <span class="v-tag">${tagNames[p.tag] || p.tag}</span>
    </div>`;
  }).join('');

  // Review queue
  const reviewPhrases = phrases.slice(0, 6);
  document.getElementById('reviewVocabList').innerHTML = reviewPhrases.map(p => {
    const mastered = isPhraseMastered(p);
    return `
    <div class="vocab-item${mastered?' mastered':''}" style="border-left:3px solid var(--warn)">
      <div class="v-row">
        <div><div class="v-phrase">${p.en}</div></div>
        <div class="v-actions">
          <button class="v-btn btn-speak" data-text="${p.en.replace(/"/g,'&quot;')}" title="发音">🔊</button>
        </div>
      </div>
      <div class="v-meaning">${p.zh}</div>
      <span class="v-tag">⏰ 待复习</span>
    </div>`;
  }).join('');

  // Year plan
  renderYearPlan();
}

// Year curriculum plan
const MONTHLY_PLAN = [
  {month:'1月',focus:'夯实基础：四级核心听力词汇 + 慢速英语习惯培养',topics:['职场自我介绍','日常办公对话','简单邮件沟通'],level:'B1'},
  {month:'2月',focus:'听力突破：连读弱读专项 + VOA慢速精听',topics:['电话沟通','团队协作','项目进度基础'],level:'B1'},
  {month:'3月',focus:'口语起步：逐句模仿跟读 + 影子训练法入门',topics:['小型会议发言','同事交流','工作计划'],level:'B1'},
  {month:'4月',focus:'词汇扩展：职场高频短语积累 + 邮件写作',topics:['邮件正式用语','商务邀约','跨部门协调'],level:'B1-B2'},
  {month:'5月',focus:'会议专题：英文会议发言 + 观点表达',topics:['提案陈述','意见表达','会议纪要'],level:'B1-B2'},
  {month:'6月',focus:'客户沟通：商务谈判基础 + 电话英语',topics:['客户拜访','需求沟通','价格谈判'],level:'B1-B2'},
  {month:'7月',focus:'演讲能力：英文汇报技巧 + PPT演讲',topics:['工作汇报','数据呈现','年终总结'],level:'B2'},
  {month:'8月',focus:'商务写作：报告撰写 + 提案写作',topics:['商业报告','项目提案','正式函件'],level:'B2'},
  {month:'9月',focus:'高阶听力：常速英语 + BBC/TED精听',topics:['行业趋势','技术创新','领导力话题'],level:'B2'},
  {month:'10月',focus:'即兴表达：脱稿复述 + 即兴问答',topics:['Q&A应对','即兴发言','跨文化场景'],level:'B2'},
  {month:'11月',focus:'综合实战：模拟商务场景全流程',topics:['完整项目周期','多方会议','危机沟通'],level:'B2'},
  {month:'12月',focus:'年终复习：全年薄弱点回顾 + 能力测评',topics:['综合复习','模拟测试','新年计划'],level:'B2'},
];

function renderYearPlan() {
  const now = new Date();
  const monthIdx = now.getMonth(); // 0=Jan
  const plan = MONTHLY_PLAN[monthIdx];
  const daysInMonth = new Date(now.getFullYear(), monthIdx+1, 0).getDate();
  const currentDay = now.getDate();
  const pct = Math.round(currentDay / daysInMonth * 100);

  document.getElementById('planMonth').textContent = `📌 ${plan.month} · ${plan.level} 级 · "${plan.focus.split('：')[0]}"`;
  document.getElementById('planFocus').innerHTML = `
    <div><b>本月目标：</b>${plan.focus}</div>
    <div style="margin-top:4px"><b>核心场景：</b>${plan.topics.join(' / ')}</div>
  `;
  document.getElementById('planProgressBar').style.width = pct + '%';
  document.getElementById('planProgressLabel').textContent = `本月进度 ${currentDay}/${daysInMonth} 天 (${pct}%)`;
}

// Vocab button handlers
document.addEventListener('click', function(e) {
  // Speak button
  const speakBtn = e.target.closest('.btn-speak');
  if (speakBtn) {
    e.stopPropagation();
    const text = speakBtn.dataset.text;
    speakPhrase(text);
    speakBtn.classList.add('playing');
    setTimeout(() => speakBtn.classList.remove('playing'), 1500);
    return;
  }

  // Record vocab button
  const recordBtn = e.target.closest('.btn-record-vocab');
  if (recordBtn) {
    e.stopPropagation();
    const idx = parseInt(recordBtn.dataset.idx);
    const text = recordBtn.dataset.text;
    startVocabRecognition(idx, text);
    return;
  }

  // Master toggle button
  const masterBtn = e.target.closest('.btn-master');
  if (masterBtn) {
    e.stopPropagation();
    const text = masterBtn.dataset.text;
    togglePhraseMastered({en: text});
    return;
  }

  // Vocab tag filter
  if (e.target.closest('#vocabTags') && e.target.classList.contains('tag')) {
    document.querySelectorAll('#vocabTags .tag').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    vocabFilter = e.target.dataset.tag;
    renderVocab();
  }
});

// =============================================
// RENDER: Review Page
// =============================================
function renderReview() {
  const data = loadData();
  const allKeys = Object.keys(data.records).sort();
  let totalMins = 0, studyDays = 0;
  allKeys.forEach(k => {
    const r = data.records[k];
    if (r && r.checkedIn) {
      studyDays++;
      totalMins += (r.totalMinutes || 0);
    }
  });

  document.getElementById('statDays').textContent = studyDays;
  document.getElementById('statMins').textContent = (totalMins/60).toFixed(0)+'h';
  document.getElementById('statAvg').textContent = studyDays>0?Math.round(totalMins/studyDays):0;
  document.getElementById('statBest').textContent = data.bestStreak||0;

  // Calendar heatmap
  renderHeatmap(data);
  // Week chart
  renderWeekChart(data);
  // Weakness report
  renderWeaknessReport(data);
  // Settings
  document.getElementById('toggleRemind').classList.toggle('on', data.settings.reminder);
}

function renderHeatmap(data) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const firstDay = new Date(y, m, 1).getDay();
  let dots = '';
  for (let i = 0; i < firstDay; i++) dots += '<div class="heat-dot" style="opacity:.3"></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = data.records[key];
    const mins = rec ? (rec.totalMinutes || 0) : 0;
    let lvl = '';
    if (mins > 0 && mins < 15) lvl = 'l1';
    else if (mins >= 15 && mins < 30) lvl = 'l2';
    else if (mins >= 30) lvl = 'l3';
    const today = d === now.getDate();
    dots += `<div class="heat-dot ${lvl}" title="${m+1}月${d}日: ${mins}分钟" style="${today?'border:2px solid var(--blue);':''}"></div>`;
  }
  document.getElementById('heatmap').innerHTML = dots;
}

function renderWeekChart(data) {
  const wd = ['一','二','三','四','五','六','日'];
  const now = new Date();
  const dow = now.getDay();
  const mondayOff = dow === 0 ? 6 : dow - 1;
  const monday = new Date(now); monday.setDate(now.getDate() - mondayOff);

  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const rec = data.records[key];
    const mins = rec ? (rec.totalMinutes || 0) : 0;
    const h = Math.max(4, Math.min(100, mins / 35 * 100));
    const isToday = key === todayKey();
    html += `<div class="bar-col"><div class="bar${isToday?' today':''}" style="height:${h}px"></div><div class="bar-min">${mins}</div><div class="bar-label">${wd[i]}</div></div>`;
  }
  document.getElementById('weekChart').innerHTML = html;
}

function renderWeaknessReport(data) {
  const mistakes = data.mistakeBank || [];
  const recentMistakes = mistakes.filter(m => {
    const d = new Date(m.date);
    const now = new Date();
    return (now - d) < 7 * 24 * 60 * 60 * 1000;
  });

  if (recentMistakes.length === 0) {
    document.getElementById('weaknessReport').innerHTML = '🎉 本周暂无薄弱项记录，继续保持！';
    return;
  }

  const wordCount = {};
  recentMistakes.forEach(m => { wordCount[m.word] = (wordCount[m.word]||0)+1; });
  const topWords = Object.entries(wordCount).sort((a,b)=>b[1]-a[1]).slice(0,5);

  document.getElementById('weaknessReport').innerHTML = `
    <div style="margin-bottom:10px">⚠️ 本周薄弱单词 TOP5：</div>
    ${topWords.map(([w,c],i) => `
      <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:var(--line)">
        <span>${i+1}. <b>${w}</b></span>
        <span style="color:var(--red)">错${c}次</span>
      </div>
    `).join('')}
    <div style="margin-top:12px;color:var(--blue-dk);font-size:13px">💡 建议：多关注拼写细节，听写时注意单词结尾发音</div>
  `;
}

// Toggle reminder
document.addEventListener('click', function(e) {
  if (e.target.id === 'toggleRemind' || e.target.closest('#toggleRemind')) {
    const d = loadData();
    d.settings.reminder = !d.settings.reminder;
    saveData(d);
    document.getElementById('toggleRemind').classList.toggle('on', d.settings.reminder);
    showToast(d.settings.reminder ? '已开启每日提醒' : '已关闭每日提醒');
  }
});

// Accent toggle
document.addEventListener('click', function(e) {
  if (e.target.id === 'accentUK' || e.target.id === 'accentUS') {
    document.getElementById('accentUK').classList.remove('active');
    document.getElementById('accentUS').classList.remove('active');
    e.target.classList.add('active');
    const d = loadData();
    d.settings.accent = e.target.id === 'accentUK' ? 'UK' : 'US';
    saveData(d);
    showToast('已切换为' + (d.settings.accent === 'UK' ? '英音' : '美音'));
  }
});

// Export / Clear
document.addEventListener('click', function(e) {
  if (e.target.id === 'btnExport') {
    const d = loadData();
    const blob = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `english-backup-${todayKey()}.json`;
    a.click();
    showToast('数据已导出');
  }
  if (e.target.id === 'btnClear') {
    if (confirm('确定清除所有学习数据？此操作无法恢复！')) {
      localStorage.removeItem(STORAGE_KEY);
      init();
      showToast('数据已清除');
    }
  }
});

// =============================================
// NAVIGATION
// =============================================
function navigateTo(page) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');

  if (page === 'listening') { stopSpeech(); renderListening(); }
  if (page === 'speaking') { stopSpeech(); speakStep = 1; renderSpeaking(); }
  if (page === 'vocab') renderVocab();
  if (page === 'review') renderReview();
  if (page === 'home') renderHome();
}

document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => navigateTo(item.dataset.page));
});

// =============================================
// UTILS
// =============================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.classList.remove('show'), 2000);
}

function showConfetti() {
  const container = document.getElementById('confetti');
  const colors = ['#C4A882','#8FA7B6','#7BA58F','#D4B87A','#C4908A','#E8D9C8'];
  container.innerHTML = '';
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.className = 'particle';
    el.style.left = Math.random()*100+'%';
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDelay = Math.random()*1.2+'s';
    el.style.animationDuration = (1+Math.random()*2)+'s';
    el.style.width = (5+Math.random()*8)+'px';
    el.style.height = (5+Math.random()*8)+'px';
    container.appendChild(el);
  }
  container.classList.add('show');
  setTimeout(() => { container.classList.remove('show'); container.innerHTML = ''; }, 2500);
}

// =============================================
// INIT
// =============================================
let data = loadData();

function init() {
  data = loadData();
  const today = getOrCreateToday(data);
  saveData(data);

  renderHome();
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-home').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('.nav-item[data-page="home"]').classList.add('active');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

init();
